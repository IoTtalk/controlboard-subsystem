<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Control Board</title>

        <!-- Add this to <head> -->

        <!-- Load required Bootstrap and BootstrapVue CSS -->
        <link type="text/css" rel="stylesheet" href="https://unpkg.com/bootstrap/dist/css/bootstrap.min.css" />
        <link type="text/css" rel="stylesheet" href="https://unpkg.com/bootstrap-vue@latest/dist/bootstrap-vue.min.css" />
        <link type="text/css" rel="stylesheet" href="../static/control_board.css" />

        <!-- Load polyfills to support older browsers -->
        <!-- <script src="https://polyfill.io/v3/polyfill.min.js?features=es2015%2CIntersectionObserver" crossorigin="anonymous"></script> -->

        <!-- Load Vue followed by BootstrapVue -->
        <!-- Develop version -->
        <script src="https://cdn.jsdelivr.net/npm/vue@2.6.12/dist/vue.js"></script>
        <!-- Production version -->
        <!-- <script src="https://unpkg.com/vue@latest/dist/vue.min.js"></script> -->
        <script src="https://unpkg.com/bootstrap-vue@latest/dist/bootstrap-vue.min.js"></script>

        <!-- Load the following for BootstrapVueIcons support -->
        <script src="https://unpkg.com/bootstrap-vue@latest/dist/bootstrap-vue-icons.min.js"></script>

    </head>
    <body>
      <div id=app>
        <!-- Navigation bar -->
        <b-navbar type="dark" variant="dark" class="d-flex">
          <select-projects
            v-bind:projects="projects"  
          ></select-projects>
        
          <div class="ml-auto">
            <b-navbar-nav>
              <b-nav-item class="system-button" v-if="user.current.superuser" v-on:click="onSwitchManage"><b>System</b></b-nav-item>
              <b-nav-item class="system-button custom-nav-item"><b>Logout</b></b-nav-item>
            </b-navbar-nav>
          </div>
        </b-navbar>
        
        <!-- Add/delete field button -->
        <div v-if="!manageMode">
          <div class="field-manage" v-if="user.current.superuser">
            <div class="d-flex justify-content-between">
              <b-button size="sm" variant="success" @click="createField" class="create-field">+ New Field</b-button>
              <b-button size="sm" variant="danger">Delete Field</b-button>
            </div>
          </div>
        </div>

        <div v-if="manageMode" class="manage-title">
          <b>System Management</b>
        </div>

        <!-- Field tabs -->
        <b-card title="Card Title" no-body class="card">
          <b-card-header header-tag="nav">
            <b-nav card-header tabs>
              <b-nav-item-dropdown text="More" lazy v-if="fields.length > 7 && !manageMode">
                <b-dropdown-item
                  v-for="(field, index) in fields.slice(7)"
                  v-bind:active="index + 7===currentField"
                  v-on:click="switchField(index + 7)"
                  align-self="end"
                > <% field %>
                </b-dropdown-item>

                <b-dropdown-item>
                  Pin Field
                  <b-img src="../static/imgs/pin.svg"></b-img>
                </b-dropdown-item>
              </b-nav-item-dropdown>
              <b-nav-item
                v-if="!manageMode"
                v-for="(field, index) in pinnedFields"
                v-bind:active="index===currentField"
                v-on:click="switchField(index)"
                class="fieldName"
              ><% field %></b-nav-item>

              <b-nav-item v-if="manageMode" v-bind:active="managePage" v-on:click="onSwitchManagePage">
                User
              </b-nav-item>
              <b-nav-item v-if="manageMode" v-bind:active="!managePage" v-on:click="onSwitchManagePage">
                ControlBoard
              </b-nav-item>

            </b-nav>
          </b-card-header>

          <b-card-body class="text-center custom-card-body">
            <div v-for="(setting, index) in settings" class="setting-card" v-if="!manageMode">
              <!-- sensor List and sensor value -->
              <sensor-row
                v-bind:sensors="setting.sensors"
                v-bind:value="setting.value"
                v-bind:index="index"
                v-bind:status="setting.status"
              ></sensor-row>
              <!-- Mode select and actuator name, Undo And Save -->
              <actuator-row
                v-bind:mode="setting.mode"
                v-bind:actuator="setting.actuator"
                v-bind:dirty="setting.dirty"
                v-bind:index="index"
                v-on:update-mode="onSelectMode"
              ></actuator-row>

              <!-- Trigger Area -->
              <div class="setting-area" v-if="setting.mode!=='ON' && setting.mode!=='OFF'">
                <div><b>Trigger</b></div>

                <!-- Sensor settings -->
                <div v-if="setting.mode==='Sensor'" class="setting-sensor">
                  <custom-sel
                    v-bind:options="comparisons"
                    v-bind:index="index"
                    v-bind:content="'open'"
                    v-bind:select="setting.content.open_sensor"
                    v-on:update-option="onSelectCompare"
                  ></custom-sel>
                  <b-form-input placeholder="Seconds" size="sm" class="custom-input"
                    v-model="setting.content.open_sensorVal"
                    v-bind:disabled="setting.content.open_sensor===null"
                  ></b-form-input>
                  <span class="setting-text-mid">ON.</span>
                  <custom-sel
                    v-bind:options="comparisons"
                    v-bind:index="index"
                    v-bind:content="'close'"
                    v-bind:select="setting.content.close_sensor"
                    v-on:update-option="onSelectCompare"
                  ></custom-sel> 
                  <b-form-input placeholder="Seconds" size="sm" class="custom-input"
                    v-model="setting.content.close_sensorVal"
                    v-bind:disabled="setting.content.close_sensor===null"
                  ></b-form-input>
                  <span class="setting-text">OFF.</span>
                </div>

                <!-- Timer setting area -->
                <div v-if="setting.mode==='Timer'">
                  <custom-sel
                    v-bind:options="hours"
                    v-bind:index="index"
                    v-bind:content="0"
                    v-bind:select="setting.content.open_timer[0]"
                    v-on:update-option="onSelectTime"
                  ></custom-sel>
                  <span>:</span>
                  <custom-sel
                    v-bind:options="minutes"
                    v-bind:index="index"
                    v-bind:content="1"
                    v-bind:select="setting.content.open_timer[1]"
                    v-on:update-option="onSelectTime"
                  ></custom-sel>
                  <span>:</span>
                  <custom-sel
                    v-bind:options="seconds"
                    v-bind:index="index"
                    v-bind:content="2"
                    v-bind:select="setting.content.open_timer[2]"
                    v-on:update-option="onSelectTime"
                  ></custom-sel>
                  <span style="padding-right: 10px;">on</span>
                  <custom-sel
                    v-bind:options="hours"
                    v-bind:index="index"
                    v-bind:content="3"
                    v-bind:select="setting.content.close_timer[0]"
                    v-on:update-option="onSelectTime"
                  ></custom-sel>
                  <span>:</span>
                  <custom-sel
                    v-bind:options="minutes"
                    v-bind:index="index"
                    v-bind:content="4"
                    v-bind:select="setting.content.close_timer[1]"
                    v-on:update-option="onSelectTime"
                  ></custom-sel>
                  <span>:</span>
                  <custom-sel
                    v-bind:options="seconds"
                    v-bind:index="index"
                    v-bind:content="5"
                    v-bind:select="setting.content.close_timer[2]"
                    v-on:update-option="onSelectTime"
                  ></custom-sel>
                  <span>off</span>
                </div>
                <div>
                  <b-form-group>
                      <b-form-checkbox-group
                        :options="weekdays" size="sm" plain
                        v-on:change="onSelectWeekdays($event, index)"
                        v-bind:checked="setting.content.weekdays"
                      ></b-form-checkbox-group>
                  </b-form-group>
                </div>

                <!-- Duty Cycle Area -->
                <div class="duty-area">
                  <div><b>Duty Cycle</b></div>
                  <div class="setting-sensor">
                    <span class="setting-text-start">ON</span>
                    <b-form-input placeholder="Seconds" size="sm" class="custom-input"
                      v-model="setting.content.duty_pos"
                    ></b-form-input>
                    <span class="setting-text-mid">Seconds.</span>
                    <span class="setting-text-start">OFF</span>
                    <b-form-input placeholder="Seconds" size="sm" class="custom-input"
                      v-model="setting.content.duty_neg"
                      v-bind:disabled="setting.content.duty_pos===0"
                    ></b-form-input>
                    <span class="setting-text-mid">Seconds.</span>
                  </div>               
                </div>
              </div>
            </div>
            <div v-if="manageMode && user.current.superuser">
              <div v-if="manageMode">
                <b-row class="text-left ">
                  <b-col><b>UserName</b></b-col>
                  <b-col><b>Privilege</b></b-col>
                </b-row>
                <b-row class="text-left manage-row"
                  v-for="(user, index) in user.users"
                >
                  <b-col><b-link v-b-modal.modal-1 size="sm" variant="outline-primary"> <% user.username %> </b-link></b-col>
                  <b-col> <% user.superuser %> </b-col>
                </b-row>
                <b-modal id="modal-1" size="lg" centered title="BootstrapVue">
                  <p class="my-4">Hello from modal!</p>
                </b-modal>
              </div>

              <div v-if="!manageMode">

              </div>
            </div>
          </b-card-body>
        </b-card>

        <!-- Confirm/Reset all buttons -->
        <b-container fluid class="bottom-button" v-if="!manageMode">
          <b-row class="text-center">
            <b-col><b-button size="lg" variant="primary">Confirm</b-button></b-col>
            <b-col><b-button size="lg" variant="secondary">Reset All</b-button></b-col>
          </b-row>
        </b-container>
      </div>
      <script type="text/javascript" src="../static/components.js"></script>
      <script type="text/javascript" src="../static/main.js"></script>
    </body>
</html>
